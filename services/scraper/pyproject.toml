[project]
name = "scraper"
version = "0.1.0"
description = "4casters Liquipedia ingestion service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "typer>=0.13.0",
    "rich>=13.9.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
scraper = "scraper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require a live Postgres connection",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The quote corpus deliberately handles unicode punctuation (smart
# quotes, em-dash, en-dash, NBSP) because that's what shows up in
# real source text. Suppressing the "ambiguous character" lints in
# just these files lets the rest of the codebase keep the guardrail.
"src/scraper/quotes/liquipedia_parser.py" = ["RUF001", "RUF003"]
"src/scraper/quotes/types.py" = ["RUF001", "RUF003"]
"tests/test_quote_types.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
